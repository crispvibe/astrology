name: Mirror release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download installers from Gitee
        run: |
          mkdir -p dist
          curl -fL --retry 3 --retry-delay 5 -o "dist/Astrarche-2.0.31-arm64.tar.xz" "https://gitee.com/crispvibe/astrology/releases/download/v2.0.31/Astrarche-2.0.31-arm64.tar.xz"
          curl -fL --retry 3 --retry-delay 5 -o "dist/Astrarche-2.0.31-x64.tar.xz" "https://gitee.com/crispvibe/astrology/releases/download/v2.0.31/Astrarche-2.0.31-x64.tar.xz"
          curl -fL --retry 3 --retry-delay 5 -o "dist/Astrarche Setup 2.0.31-x64.exe" "https://gitee.com/crispvibe/astrology/releases/download/v2.0.31/Astrarche%20Setup%202.0.31-x64.exe"
          curl -fL --retry 3 --retry-delay 5 -o "dist/Astrarche Setup 2.0.31-arm64.exe" "https://gitee.com/crispvibe/astrology/releases/download/v2.0.31/Astrarche%20Setup%202.0.31-arm64.exe"
          ls -lh dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.31
          name: Astrarche 2.0.31
          body: GitHub mirror of the Gitee v2.0.31 release.
          files: dist/*
